name: Construire l'APK Affairs Dirigeants

on:
  push:
    paths:
      - 'dirigeants/**'
      - 'adresse-serveur.txt'
      - '.github/workflows/apk-dirigeants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dirigeants
    steps:
      - uses: actions/checkout@v4

      - name: Adresse du serveur (variable AFFAIRS_API ou fichier adresse-serveur.txt)
        id: cfg
        working-directory: .
        run: |
          API="${{ vars.AFFAIRS_API }}"
          if [ -z "$API" ] && [ -f adresse-serveur.txt ]; then API=$(tr -d ' \r\n' < adresse-serveur.txt); fi
          API="${API%/}"
          if [ -z "$API" ]; then echo "::warning::Aucune adresse de serveur configurée."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "api=$API" >> "$GITHUB_OUTPUT"; echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire l'application
        run: python3 build.py

      - name: Brancher l'application sur le serveur
        if: steps.cfg.outputs.ok == 'true'
        run: echo "window.AFFAIRS_API = \"${{ steps.cfg.outputs.api }}\";" > www/config.js

      - name: Préparer le projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#141414' --splashBackgroundColor '#141414'
          npx cap sync android

      - name: Compiler l'APK
        working-directory: dirigeants/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Affairs-Dirigeants.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Affairs-Dirigeants-APK
          path: dirigeants/Affairs-Dirigeants.apk

      - name: Publier le lien de téléchargement direct
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dirigeants --yes --cleanup-tag || true
          gh release create dirigeants Affairs-Dirigeants.apk --title "Affairs Dirigeants – version de test" --notes "Application privée de la direction. Ouvrez ce lien sur votre téléphone Android pour l'installer." --latest=false
