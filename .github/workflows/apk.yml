name: Construire l'APK Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ranger les fichiers envoyés à plat
        run: |
          mkdir -p src assets
          for f in app.part app.js.part logo.png magasins.json; do if [ -f "$f" ]; then mv "$f" src/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv "$f" assets/; fi; done
          ls src assets

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: python3 build.py

      - name: Adresse du serveur d'estimation (facultatif)
        # Variable du dépôt AFFAIRS_API (Settings › Secrets and variables › Actions › Variables).
        # Vide = version de démonstration.
        if: ${{ vars.AFFAIRS_API != '' }}
        run: echo "window.AFFAIRS_API = \"${{ vars.AFFAIRS_API }}\";" > www/config.js

      - name: Préparer le projet Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx @capacitor/assets generate --android --iconBackgroundColor '#e30613' --splashBackgroundColor '#ffffff'
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Affairs-demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Affairs-APK
          path: Affairs-demo.apk
